<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>Game Hub</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f1115; color: #e8eaf0; min-height: 100vh; }
    header { padding: 28px 40px 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0.5px; }
    .sub { color: #8a90a0; margin-top: 6px; font-size: 13px; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 16px 40px 40px; }
    .card { background: #181b23; border: 1px solid #262a35; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
    .icon { font-size: 40px; }
    .title { font-size: 20px; font-weight: 600; }
    .desc { color: #8a90a0; font-size: 14px; flex: 1; }
    .badge { align-self: flex-start; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; padding: 3px 8px; border-radius: 999px; background: #232836; color: #9aa3b8; }
    .badge.ok { background: #173524; color: #7ddc9a; }
    .badge.warn { background: #3a2b14; color: #f0b35e; }
    .badge.miss { background: #3a1a1a; color: #f08080; }
    .actions { display: flex; gap: 8px; margin-top: 6px; }
    button { flex: 1; background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
    button:hover { background: #2563eb; }
    button:disabled { background: #2a2f3c; color: #6b7285; cursor: default; }
    button.secondary { background: #232836; color: #c9cfdc; }
    button.secondary:hover { background: #2c3242; }
    button.wide { flex: 0 0 auto; padding: 10px 18px; }
    .status { min-height: 22px; padding: 0 40px 24px; font-size: 13px; color: #f0a35e; white-space: pre-wrap; }
    .empty { color: #8a90a0; padding: 40px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Game Hub</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="wide" id="syncBtn">Aktualisieren</button>
  </header>
  <main id="grid"></main>
  <div class="status" id="status"></div>

  <script>
    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const syncBtn = document.getElementById('syncBtn');
    const sub = document.getElementById('sub');
    let role = 'client';

    function setStatus(text) { statusEl.textContent = text || ''; }

    const labels = {
      aktuell: ['Aktuell', 'ok'],
      update: ['Update verfügbar', 'warn'],
      fehlt: ['Nicht installiert', 'miss'],
      lokal: ['Lokal', 'ok'],
      'nicht-gefunden': ['Pfad fehlt', 'miss'],
    };

    function render(games) {
      grid.innerHTML = '';
      if (!games.length) {
        grid.innerHTML = '<div class="empty">Keine Spiele gefunden. Auf dem Host-PC ist noch nichts freigegeben oder der Host ist nicht erreichbar.</div>';
        return;
      }
      for (const game of games) {
        const card = document.createElement('div');
        card.className = 'card';

        const icon = document.createElement('div');
        icon.className = 'icon';
        icon.textContent = game.icon || '🎮';

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = game.title;

        const [label, cls] = labels[game.status] || ['', ''];
        const badge = document.createElement('span');
        badge.className = 'badge ' + cls;
        const ver = game.installedVersion ? ' · v' + game.installedVersion : '';
        badge.textContent = label + ver;

        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = game.description || '';

        const actions = document.createElement('div');
        actions.className = 'actions';

        const play = document.createElement('button');
        play.textContent = 'Starten';
        play.disabled = !game.launchable;
        play.onclick = async () => {
          const res = await window.hub.launch(game.id);
          setStatus(res.ok ? game.title + ' gestartet.' : 'Fehler: ' + res.error);
        };
        actions.append(play);

        if (game.path) {
          const show = document.createElement('button');
          show.className = 'secondary';
          show.textContent = 'Ordner';
          show.onclick = () => window.hub.openFolder(game.id);
          actions.append(show);
        }

        card.append(icon, title, badge, desc, actions);
        grid.append(card);
      }
    }

    async function refresh() {
      render(await window.hub.list());
    }

    async function doSync() {
      syncBtn.disabled = true;
      setStatus('Prüfe auf Updates …');
      const res = await window.hub.sync();
      render(res.games);
      if (res.ok) setStatus('Fertig: ' + res.summary + '.');
      else setStatus((res.error || '') + (res.errors ? res.errors.join('\n') : ''));
      syncBtn.disabled = false;
    }

    window.hub.onProgress((text) => setStatus(text));
    window.hub.onSynced(async (res) => {
      await refresh();
      if (res.ok) setStatus('Fertig: ' + res.summary + '.');
      else setStatus((res.error || '') + (res.errors ? res.errors.join('\n') : ''));
    });

    syncBtn.onclick = doSync;

    window.hub.info().then((info) => {
      role = info.role;
      if (role === 'host') {
        sub.textContent = 'Host: Freigabe läuft auf Port ' + info.port + '. Solange dieses Fenster offen ist, können andere laden.';
        syncBtn.style.display = 'none';
      } else {
        sub.textContent = info.source ? 'Host gefunden: ' + info.source : 'Suche Host im Netzwerk …';
      }
      refresh();
    });
  </script>
</body>
</html>
